[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traceforge"
version = "0.1.0"
description = "Evidence-first pre-production reliability agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "TraceForge contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.24,<2",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
traceforge = "traceforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["services/orchestrator/src/traceforge"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "services/orchestrator/src", "services/demo-target"]
asyncio_mode = "auto"
markers = [
  "integration: local integration tests",
  "real_signoz: requires a real SigNoz account",
  "e2e: executable end-to-end tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/orchestrator/src", "services/demo-target", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["traceforge"]
mypy_path = ["services/orchestrator/src"]
plugins = ["pydantic.mypy"]
exclude = [
  "fixtures/generated-demo-repositories/",
  "pytest-cache-files-.*/",
  "services/demo-target/",
  "scripts/",
  "tests/",
]

[[tool.mypy.overrides]]
module = ["mcp.*", "opentelemetry.*"]
ignore_missing_imports = true

